[project]
name = "ttb-label-check"
version = "0.4.0"
description = "TTB AI-powered alcohol label verification prototype."
requires-python = ">=3.12"
dependencies = [
    "fastapi >= 0.115",
    "uvicorn[standard] >= 0.32",
    "pydantic >= 2.9",
    "pydantic-settings >= 2.6",
    "jinja2 >= 3.1",
    "python-multipart >= 0.0.12",
    "pyyaml >= 6.0",
    "rapidfuzz >= 3.10",
    "pillow >= 11.0",
    "httpx >= 0.27",
    "sse-starlette >= 2.1",
    "numpy >= 2.0",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30",
    "opencv-python>=4.10,<5",
]

[dependency-groups]
dev = [
    "pytest >= 8.3",
    "pytest-asyncio >= 0.24",
    "taskipy >= 1.13",
    "respx >= 0.21",
    "playwright >= 1.48",
    "pytest-playwright >= 0.6",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "mutmut>=3.7.0",
]

[tool.taskipy.tasks]
demo = "uvicorn app.main:app --port 8000 --reload"
demo-prod = "uvicorn app.main:app --port 8000"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
# An `xfail` with no `strict=` passes whether the code works or not, so it is
# counted in the total while asserting nothing. Under this setting a test marked
# `xfail` that starts passing fails until someone removes the mark, which is the
# point of marking it. `tests/test_no_test_can_pass_either_way.py` also refuses
# an explicit `strict=False`, which would override this.
xfail_strict = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# The codebase is written to about a hundred columns: 32 lines in `app/` run
# past it, 119 past the 88 ruff would otherwise pick. Setting it to what the
# code already is keeps the formatter from rewrapping ten thousand lines to
# settle a number nobody chose.
line-length = 100
target-version = "py312"

# ruff 0.16 formats Python code blocks inside markdown as well as `.py` files.
# The only markdown here that carries Python is `docs/research/`, whose blocks
# quote external examples inside dated research notes — reformatting them edits
# a record rather than this project's source. No markdown in this tree is
# project source, so markdown is out of scope for both the linter and the
# formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Deliberately more than ruff's default, which is `E4`, `E7`, `E9` and `F`.
# Every code here has caught something real in this tree or guards something
# this project has already got wrong once:
#   E,W  whitespace and syntax-adjacent style
#   F    undefined and unused names — `F821` found three annotations naming
#        classes that were never imported, live in `app/`
#   I    import order, so a diff is about what changed rather than where an
#        import landed
#   B    bugbear: mutable defaults, blind excepts, loop-variable capture
#   UP   syntax this Python version supersedes
#   SIM  branches that collapse
#   C4   comprehensions built the long way
#   RET  returns that say nothing
#   PIE  dead scaffolding
#   RUF  ruff's own, including unused `noqa` directives
# `E501`, long lines, is kept at the same 100 columns as the formatter, and it
# is worth saying why, because the two rules can look like they overlap.
# `ruff format` owns wrapping code, and it took 191 of the 218 long lines on
# its own. What it cannot break is a string literal or a comment, so `E501` is
# exactly the rule for the lines only a person can fix. There were 27 of them:
# structured log lines, assertion messages, one docstring paragraph and two
# trailing comments, all split by hand. One line carries `# noqa: E501` with
# its reason -- a regex, which is worse split than long. So this is a one-time
# cost rather than a standing tax, and the alternatives were worse: dropping
# `E501` leaves a long string unbounded forever, and a second, higher limit
# just for it means two line lengths in one file, with the second number
# chosen to fit the lines that happened to exist.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "RUF"]

# `RUF001`/`RUF002` flag characters that look like ASCII, which is how a
# homoglyph gets into a string unnoticed. This codebase normalises typography
# for a living, so every one of the fourteen it found was the character being
# deliberately matched or replaced: the curly quotes in `brand_match.py` and
# `verbatim_hash.py` are the ones being folded to straight ones, the en dash in
# `heading_style_check.py` is in a strip set, the fullwidth colon in
# `local.py` is what an OCR pass returns, and the rest are correct typography
# in prose. Allowing exactly those five keeps the rule watching for any other.
# Written as escapes because a literal one here would be the same ambiguity the
# rule exists to flag: U+00D7 multiplication sign, U+2013 en dash, U+2018 and
# U+2019 single curly quotes, U+FF1A fullwidth colon.
allowed-confusables = ["\u00d7", "\u2013", "\u2018", "\u2019", "\uff1a"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares a dependency as a default argument — `x = Depends(...)`,
# `f: UploadFile = File(...)`. That is the framework's documented spelling, and
# B008 exists to catch a mutable default built once at import; these are the
# framework's own markers, evaluated per request by design.
"app/api/*" = ["B008"]
"app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# Deliberately permissive to start, and the setting is the point: a type
# checker nobody can turn on is worth nothing. At this setting the tree reported
# 21 errors on the first run, in nine files; all 21 were fixed rather than
# silenced, so the checker is green and a new error is this change's error
# rather than one of a thousand inherited ones. Tightening it —
# `disallow_untyped_defs`, then `strict` — is its own piece of work, done module
# by module against a checker that is already green.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true

[tool.coverage.run]
# `app` is the product; `tests`, `eval` and `scripts` are not what a coverage
# figure is about. Branch coverage rather than line coverage, because a
# validator that is entered and returns down one of two paths is the shape this
# codebase is full of, and line coverage calls that covered.
source = ["app"]
branch = true
# The browser group runs the app in a live server thread, so its work is
# measured in the same process as the rest.
concurrency = ["thread", "multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
# No `fail_under` yet, deliberately. Setting a gate at a number nobody has
# measured is how a suite gets shaped to the gate; the measured figure is
# recorded first, and the gate is its own later piece of work.
show_missing = false
skip_covered = false
exclude_also = [
    # A branch that exists only for the type checker never runs.
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.mutmut]
# Mutation testing deliberately breaks the source and checks whether a test
# notices. A mutant that survives marks an assertion nobody is really making.
#
# Scoped deliberately narrow. `app/rules/_validators/` is where a rule's verdict
# is actually decided, and `tests/rules/_validators/` drives those validators
# directly in 0.47 s — a mutation run is the whole test suite once per mutant, so
# a fast, focused suite is the difference between a run that finishes and one
# nobody waits for. Widening this is its own decision, not a default.
source_paths = ["app/rules/_validators/"]
# `tests_dir` is the same setting under its old name, and mutmut warns on it.
pytest_add_cli_args_test_selection = ["tests/rules/_validators/"]
# The validators read the shipped decision tables, so the rule pack travels with
# the copied tree mutmut builds under `mutants/`.
# mutmut copies only `source_paths` out of `app/`, and `tests/conftest.py` imports
# `app.main` at module load, so the rest of the package has to travel too. The
# rule pack and its pinned assets come along because the validators read them.
also_copy = ["rules", "assets", "app"]
# mutmut can tell a Python source file changed, so it knows to re-run the mutants
# that file affects. It cannot do that for anything else, and by default it keeps
# the cached verdict and prints a warning. The validators read their thresholds
# and reason codes out of the YAML rule pack, so a rule pack edit changes what
# every one of these mutants does while leaving mutmut's answer untouched — a
# survivor list that describes a tree nobody has now. In one measured case, a
# run reporting 20 `heading_style_check` survivors was reporting cache, and two
# of those mutants fail two tests apiece when actually run. Re-running costs
# about ten seconds for the whole package, which is less than the cost of one
# wrong number.
on_dependency_change = "rerun"
