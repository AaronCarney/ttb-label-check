[project]
name = "ttb-label-prototype"
version = "0.2.0"
description = "TTB AI-powered alcohol label verification prototype."
requires-python = ">=3.12"
dependencies = [
    "fastapi >= 0.115",
    "uvicorn[standard] >= 0.32",
    "pydantic >= 2.9",
    "pydantic-settings >= 2.6",
    "jinja2 >= 3.1",
    "python-multipart >= 0.0.12",
    "pyyaml >= 6.0",
    "rapidfuzz >= 3.10",
    "pillow >= 11.0",
    "httpx >= 0.27",
    "sse-starlette >= 2.1",
    "numpy >= 2.0",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30",
    "opencv-python>=4.10,<5",
]

[dependency-groups]
dev = [
    "pytest >= 8.3",
    "pytest-asyncio >= 0.24",
    "taskipy >= 1.13",
    "respx >= 0.21",
    "playwright >= 1.48",
    "pytest-playwright >= 0.6",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
]

[tool.taskipy.tasks]
demo = "uvicorn app.main:app --port 8000 --reload"
demo-prod = "uvicorn app.main:app --port 8000"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# The codebase is written to about a hundred columns: 32 lines in `app/` run
# past it, 119 past the 88 ruff would otherwise pick. Setting it to what the
# code already is keeps the formatter from rewrapping ten thousand lines to
# settle a number nobody chose.
line-length = 100
target-version = "py312"

# ruff 0.16 formats Python code blocks inside markdown as well as `.py` files.
# The only markdown here that carries Python is `docs/research/`, whose blocks
# quote external examples inside dated research notes — reformatting them edits
# a record rather than this project's source. No markdown in this tree is
# project source, so markdown is out of scope for both the linter and the
# formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Deliberately more than ruff's default, which is `E4`, `E7`, `E9` and `F`.
# Every code here has caught something real in this tree or guards something
# this project has already got wrong once:
#   E,W  whitespace and syntax-adjacent style
#   F    undefined and unused names — `F821` found three annotations naming
#        classes that were never imported, live in `app/`
#   I    import order, so a diff is about what changed rather than where an
#        import landed
#   B    bugbear: mutable defaults, blind excepts, loop-variable capture
#   UP   syntax this Python version supersedes
#   SIM  branches that collapse
#   C4   comprehensions built the long way
#   RET  returns that say nothing
#   PIE  dead scaffolding
#   RUF  ruff's own, including unused `noqa` directives
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares a dependency as a default argument — `x = Depends(...)`,
# `f: UploadFile = File(...)`. That is the framework's documented spelling, and
# B008 exists to catch a mutable default built once at import; these are the
# framework's own markers, evaluated per request by design.
"app/api/*" = ["B008"]
"app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# Deliberately permissive to start, and the setting is the point: a type
# checker nobody can turn on is worth nothing. This configuration runs clean
# today, so a new error is this change's error rather than one of a thousand
# inherited ones. Tightening it — `disallow_untyped_defs`, then `strict` — is
# its own piece of work, done module by module against a checker that is
# already green.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
