# Reason-code registry. Every code a rule or the application can emit is declared
# here, with the grammar BIN.SUB.SPECIFIC[.QUALIFIER], and BIN is one of the keys
# under `bins:`. Loader cross-check 7 refuses startup if any rule references a code
# not present here. Adding a new code is a one-line registry edit; removing one
# when a rule still references it fails the loader.
#
# A code that nothing emits goes in the `reviewer_vocabulary:` block at the foot of
# this file, with the reason it stays. tests/rules/test_reason_code_registry.py
# fails on a registered code that is neither emitted nor listed there, and on a
# listed code that something does emit.
version: "0.1.0"

bins:
  BRAND: "Brand-name fields"
  CLASS_TYPE: "Class / type designation"
  ALCOHOL_CONTENT: "Alcohol-content statement"
  NAME_ADDRESS: "Bottler / packer / importer name and address"
  NET_CONTENTS: "Net-contents statement"
  ORIGIN: "Country-of-origin statement (imports)"
  WARNING: "27 CFR Part 16 GOVERNMENT WARNING"
  LEGIBILITY: "Legibility / readability"
  ENGINE: "Engine-internal failure modes"
  AGE_STATEMENT: "Age statements (spirits-deep)"

codes:
  # ---- BRAND ----
  BRAND.PRESENCE.MISSING:
    description: "Brand name field absent on the label."
    cfr_anchors: ["27 CFR §4.32(a)(1)", "27 CFR §5.63(a)", "27 CFR §7.63(a)(1)"]
    severity: reject
  BRAND.NAME.MISMATCH:
    description: "Label brand fails fuzzy match against the application brand."
    cfr_anchors: ["27 CFR §4.33", "27 CFR §5.64", "27 CFR §7.64"]
    severity: reject
  BRAND.NAME.NEEDS_REVIEW:
    description: "Brand match falls in the borderline band — a reviewer decides."
    cfr_anchors: ["27 CFR §4.33", "27 CFR §5.64", "27 CFR §7.64"]
    severity: warn

  # ---- CLASS_TYPE ----
  CLASS_TYPE.PRESENCE.MISSING:
    description: "Class / type designation absent."
    cfr_anchors: ["27 CFR §4.32(a)(2)", "27 CFR §5.63(a)", "27 CFR §7.63(a)(2)"]
    severity: reject
  CLASS_TYPE.SOI.NO_MATCH:
    # A reviewer's finding, not a rejection. The allow-list behind it names the
    # standards of identity Part 5 Subpart I defines, and Subpart I also lets a
    # spirit with no standard be designated by a fanciful name with a truthful
    # statement of composition. So a designation the list does not carry is not
    # evidence the label is wrong.
    description: "Label designation names no standard of identity the rule pack recognises; a reviewer decides."
    cfr_anchors: ["27 CFR §5 Subpart I"]
    severity: warn
  CLASS_TYPE.INPUT.UNKNOWN:
    description: "Beverage class could not be determined from application."
    cfr_anchors: []
    severity: reject
  CLASS_TYPE.MATCH.APPLICATION_LABEL_DISAGREE:
    description: "Application class disagrees with label-implied class."
    cfr_anchors: []
    severity: reject
  CLASS_TYPE.MATCH.NEEDS_REVIEW:
    description: "Label designation and application class cannot be lined up against the recognised classes; a reviewer decides."
    cfr_anchors: []
    severity: warn

  # ---- ALCOHOL_CONTENT ----
  ALCOHOL_CONTENT.PRESENCE.MISSING:
    description: "Alcohol-content statement required but absent."
    cfr_anchors: ["27 CFR §4.32(b)(1)", "27 CFR §4.36(a)", "27 CFR §5.63(a)", "27 CFR §5.65(a)", "27 CFR §7.63(a)(3)"]
    severity: reject
  ALCOHOL_CONTENT.FORMAT.INVALID:
    # Not in `reviewer_vocabulary:` below, and that is correct: the three
    # `alcohol.format` rules do name this code, so something emits it as far as
    # the registry is concerned. Those rules are switched off, because no reader
    # returns the label's own alcohol wording and the check cannot be made
    # without it. See docs/decisions.md#0011.
    description: "Alcohol-content statement format does not satisfy regulation pattern."
    cfr_anchors: ["27 CFR §4.36(b)(1)", "27 CFR §5.65(b)", "27 CFR §7.65(b)"]
    severity: reject
  ALCOHOL_CONTENT.TOLERANCE.OUT_OF_BAND:
    # Nothing emits this; the reason it stays is in `reviewer_vocabulary:` at
    # the foot of this file, which is checked. See docs/decisions.md#0008.
    description: "Reviewer judged the stated alcohol content to disagree with the product."
    cfr_anchors: ["27 CFR §4.36(b)(1)", "27 CFR §5.65(c)", "27 CFR §7.65(c)"]
    severity: reject
  ALCOHOL_CONTENT.MATCH.APPLICATION_LABEL_DISAGREE:
    description: "Label alcohol content is not the alcohol content the application declared."
    cfr_anchors: []
    severity: reject
  ALCOHOL_CONTENT.MATCH.NEEDS_REVIEW:
    description: "Label or application alcohol content yields no single number to compare; a reviewer decides."
    cfr_anchors: []
    severity: warn

  # ---- NAME_ADDRESS / NET_CONTENTS ----
  NAME_ADDRESS.PRESENCE.MISSING:
    description: "Bottler / packer / importer name and address statement absent."
    cfr_anchors: ["27 CFR §4.32(a)(3)", "27 CFR §4.35", "27 CFR §5.63(b)(1)", "27 CFR §7.63(a)(4)"]
    severity: reject
  NET_CONTENTS.PRESENCE.MISSING:
    description: "Net-contents statement absent."
    cfr_anchors: ["27 CFR §4.32(b)(2)", "27 CFR §4.37", "27 CFR §5.63(b)(2)", "27 CFR §5.70", "27 CFR §7.63(a)(5)", "27 CFR §7.70"]
    severity: reject
  NAME_ADDRESS.MATCH.NEEDS_REVIEW:
    description: "Label name and address cannot be lined up with the applicant, its trade names or its city and State; a reviewer decides."
    cfr_anchors: []
    severity: warn
  NET_CONTENTS.MATCH.APPLICATION_LABEL_DISAGREE:
    description: "Label net contents are not the net contents the application declared."
    cfr_anchors: []
    severity: reject
  NET_CONTENTS.MATCH.NEEDS_REVIEW:
    description: "Label and application net contents could not be compared: one of them states no single quantity, or the label's unit has no conversion into the unit the application declared. A reviewer decides."
    cfr_anchors: []
    severity: warn

  # ---- ORIGIN ----
  ORIGIN.PRESENCE.MISSING:
    description: "Imported product, and the label carries no country-of-origin statement."
    cfr_anchors: ["27 CFR §4.35(e)", "27 CFR §5.69", "27 CFR §7.69", "19 CFR §134.45(a)(1)"]
    severity: reject
  ORIGIN.MATCH.APPLICATION_LABEL_DISAGREE:
    description: "Label origin statement does not carry the country the application declared in a form this check reads — it may name another country, or the same one in a language, abbreviation or adjectival form the check does not recognise (19 CFR §134.45(b), (c)); a reviewer decides."
    cfr_anchors: ["19 CFR §134.45(b)", "19 CFR §134.45(c)"]
    severity: warn
  ORIGIN.MATCH.NEEDS_REVIEW:
    description: "Application says the product is imported but names no country; a reviewer decides."
    cfr_anchors: []
    severity: warn

  # ---- WARNING ----
  WARNING.PRESENCE.MISSING:
    description: "27 CFR §16.21 GOVERNMENT WARNING absent from the label."
    cfr_anchors: ["27 CFR §16.21"]
    severity: reject
  WARNING.VERBATIM.MISMATCH:
    description: "GOVERNMENT WARNING text does not match the verbatim §16.21 string (after canonicalization)."
    cfr_anchors: ["27 CFR §16.21"]
    severity: reject
  WARNING.STYLE.HEADING_NOT_BOLD_CAPS:
    description: "Heading is not bold uppercase as required by §16.22(a)(2)."
    cfr_anchors: ["27 CFR §16.22(a)(2)"]
    severity: reject
  WARNING.LEGIBILITY.NO_CONTRAST:
    description: "Warning is not on a contrasting background as required by §16.22(a)(1)."
    cfr_anchors: ["27 CFR §16.22(a)(1)"]
    severity: reject
  WARNING.LEGIBILITY.LOW_RESOLUTION:
    description: "Image quality insufficient to verify warning legibility."
    cfr_anchors: ["27 CFR §16.22(a)(1)"]
    severity: warn
  WARNING.LEGIBILITY.GLARE:
    description: "Specular highlights or overexposed regions in the warning area prevent reliable extraction."
    cfr_anchors: ["27 CFR §16.21"]
    severity: warn
  WARNING.LEGIBILITY.MOTION_BLUR:
    description: "Motion blur in the warning area exceeds the legibility gate; extraction unreliable."
    cfr_anchors: ["27 CFR §16.21"]
    severity: warn
  WARNING.TYPE_SIZE.UNDER_MIN:
    description: "Warning text height is under the §16.22(b) minimum for the container size."
    cfr_anchors: ["27 CFR §16.22(b)"]
    severity: reject
  WARNING.TYPE_SIZE.CPI_EXCEEDED:
    description: "Warning text exceeds maximum characters-per-inch per §16.22(a)(4) decision table."
    cfr_anchors: ["27 CFR §16.22(a)(4)"]
    severity: reject
  WARNING.PLACEMENT.NOT_SEPARATE:
    description: "Warning is not separate and apart from other label information."
    cfr_anchors: ["27 CFR §16.21"]
    severity: reject
  # The five codes below say what the product could not measure, as against
  # the codes above, which say what the label got wrong. A finding carrying
  # one of these is insufficient evidence: it sends the label to a reviewer
  # and never rejects it.
  WARNING.STYLE.BOLD_NOT_MEASURED:
    description: "Heading capitals were checked; its bold weight could not be measured from this image, so a reviewer decides whether §16.22(a)(2) is met."
    cfr_anchors: ["27 CFR §16.22(a)(2)"]
    severity: warn
  WARNING.LEGIBILITY.CONTRAST_NOT_MEASURED:
    description: "This product does not read the colour of the warning text or of the surface behind it, so the §16.22(a)(1) contrasting background is not checked."
    cfr_anchors: ["27 CFR §16.22(a)(1)"]
    severity: warn
  WARNING.TYPE_SIZE.HEIGHT_NOT_MEASURED:
    description: "Type height in millimetres needs the image's physical scale, which a photograph does not carry, so the §16.22(b) minimum for the container size is not checked."
    cfr_anchors: ["27 CFR §16.22(b)"]
    severity: warn
  WARNING.TYPE_SIZE.CPI_NOT_MEASURED:
    description: "Characters per inch needs the image's physical scale, which a photograph does not carry, so the §16.22(a)(4) maximum is not checked."
    cfr_anchors: ["27 CFR §16.22(a)(4)"]
    severity: warn
  WARNING.PLACEMENT.ISOLATION_NOT_MEASURED:
    description: "No reader reports the distance from the warning to the nearest other text, so whether it stands separate and apart under §16.21 is not checked."
    cfr_anchors: ["27 CFR §16.21"]
    severity: warn

  # ---- LEGIBILITY ----
  LEGIBILITY.FIELD.NOT_READ:
    # One code for every rule, because the finding is the same one whatever
    # element it is about: the reader did not find it on the label, so nobody
    # checked it and a reviewer has to. The rule_id and the field on the finding
    # say which element. It is deliberately not a per-bin code - BRAND.*, say -
    # because it is not a finding about the brand, it is a finding about the
    # reading.
    description: "The reader did not find this element on the label, so the check was not made; a reviewer settles it."
    cfr_anchors: []
    severity: warn
  LEGIBILITY.FIELD_OF_VISION.SPLIT:
    description: "Required spirits fields are not in the same field of vision (§5.63(a))."
    cfr_anchors: ["27 CFR §5.63(a)"]
    severity: reject

  # ---- AGE_STATEMENT ----
  AGE_STATEMENT.FLOOR.MISSING:
    description: "Age statement required by §5.74 missing or below the regulatory floor."
    cfr_anchors: ["27 CFR §5.74"]
    severity: reject

  # ---- ENGINE ----
  ENGINE.INPUT.APPLICATION_MISSING:
    description: "Application data missing at evaluation time."
    cfr_anchors: []
    severity: reject
  ENGINE.INPUT.LABEL_IMAGE_MISSING:
    description: "Label image missing at evaluation time."
    cfr_anchors: []
    severity: reject
  ENGINE.INPUT.LABEL_IMAGE_UNSUPPORTED:
    description: "Uploaded file is not a PNG or JPEG image, so it was not read."
    cfr_anchors: []
    severity: reject
  ENGINE.RULE.CONFLICT:
    description: "Two or more rules emit conflicting dispositions for the same field."
    cfr_anchors: []
    severity: reject
  ENGINE.EVIDENCE.BELOW_CONFIDENCE_FLOOR:
    description: "The label reading this check rests on scored below the confidence the rule requires, so the check could not be settled; a reviewer reads the label."
    cfr_anchors: []
    severity: warn
  ENGINE.OBSERVATION.AMBIGUOUS:
    description: "OCR returned multiple plausible candidates with no clear winner."
    cfr_anchors: []
    severity: warn
  ENGINE.RULESET.VERSION_NOT_FOUND:
    description: "Requested rule-set version is outside the engine-supported range."
    cfr_anchors: []
    severity: reject
  ENGINE.VALIDATOR.EXCEPTION:
    description: "An uncaught exception was raised inside a validator."
    cfr_anchors: []
    severity: reject
  ENGINE.VALIDATOR.NOT_FOUND:
    description: "Rule references a validator name not present in VALIDATOR_REGISTRY (a configuration error; loader cross-check 6 normally prevents reaching this branch at runtime)."
    cfr_anchors: []
    severity: reject
  ENGINE.VALIDATOR.TIMEOUT:
    description: "Per-rule timeout exceeded."
    cfr_anchors: []
    severity: warn
  ENGINE.SLA.TIMEOUT:
    description: "Whole-evaluation 5 s SLA exhausted before completion."
    cfr_anchors: []
    severity: warn
  ENGINE.MEASUREMENT.MISSING_DPI:
    description: "Measurement-bearing rule missing required DPI metadata."
    cfr_anchors: []
    severity: warn
  ENGINE.REFERENCE_DATA.UNAVAILABLE:
    description: "Reference data (e.g., AVA whitelist, decision table) failed to load."
    cfr_anchors: []
    severity: reject
  ENGINE.MODEL.UNAVAILABLE:
    description: "The hosted reader's endpoint was unavailable when it was called."
    cfr_anchors: []
    severity: reject
  ENGINE.EXTRACTION.UNAVAILABLE:
    description: "Vision extractor raised before producing any FieldObservation (chokepoint routes to needs_review per evaluator P4)."
    cfr_anchors: []
    severity: warn
  ENGINE.RULES.UNAVAILABLE:
    description: "Rule engine raised before producing any ValidationResult (chokepoint routes to needs_review per evaluator P4)."
    cfr_anchors: []
    severity: warn
  ENGINE.WORKER.UNHANDLED:
    description: "Batch worker caught an unhandled exception during per-label evaluation; SSE stream-end carries the error class."
    cfr_anchors: []
    severity: warn
  ENGINE.BATCH.CONFLICT:
    description: "POST /batches received a batch_id already in flight."
    cfr_anchors: []
    severity: reject
  ENGINE.BATCH.NOT_FOUND:
    description: "Snapshot or stream requested for an unknown batch_id."
    cfr_anchors: []
    severity: warn
  ENGINE.OVERRIDE.NOT_FOUND:
    description: "A reviewer's override named an evaluation that carries no result: either no such evaluation, or the label is still queued."
    cfr_anchors: []
    severity: warn
  ENGINE.RULE_PACK.SELECTED:
    description: "Names the rules this evaluation ran: the beverage the application declared, plus the rules that apply to every beverage."
    cfr_anchors: []
    severity: info
  ENGINE.RULE_PACK.NOT_SELECTED:
    description: "The application named no beverage, so no rule could be selected and nothing was checked."
    cfr_anchors: []
    severity: warn
  ENGINE.OK.NONE:
    description: "Sentinel for happy-path log lines that carry the structured reason_code field by convention."
    cfr_anchors: []
    severity: warn

# Codes nothing emits, and why each one stays.
#
# `codes:` above is the vocabulary; this block is the part of it that no rule
# and no line of application code produces. It is here so that "nothing emits
# this" is a statement the file makes rather than an absence a reader has to
# notice, and tests/rules/test_reason_code_registry.py holds the two halves
# together: a registered code that nothing emits and that is not listed here
# fails, and a code listed here that something does emit fails too.
#
# None of these is dead. app/api/overrides.py accepts any code in `codes:`, so
# every one of them is a sentence a reviewer can put on a label by hand. What
# they are not is something the engine will ever say on its own.
reviewer_vocabulary:
  ALCOHOL_CONTENT.TOLERANCE.OUT_OF_BAND:
    "A reviewer holding a laboratory figure the application does not carry can
     still override the label with it. The engine compares two declared values
     and has no third number to compare against. See docs/decisions.md#0008."
  CLASS_TYPE.INPUT.UNKNOWN:
    "The engine reports an application that names no beverage as
     ENGINE.RULE_PACK.NOT_SELECTED, which says the same thing from the rule
     side. This code stays as the reviewer's way of putting it on the
     application."
  ENGINE.INPUT.APPLICATION_MISSING:
    "An evaluation with no application never starts, so no finding carries
     this. Kept as the reviewer's term for an application that arrived empty.
     Its sibling ENGINE.INPUT.LABEL_IMAGE_MISSING is emitted, by
     app/batch/worker.py, and is not listed here."
  ENGINE.MEASUREMENT.MISSING_DPI:
    "The rules that would have needed the image's physical scale are the four
     switched-off measurement rules in rules/common/health_warning.yaml, and
     they now answer WARNING.*_NOT_MEASURED instead. Nothing reaches a DPI
     check. See docs/decisions.md#0013."
  ENGINE.MODEL.UNAVAILABLE:
    "A reader that fails reaches a finding as ENGINE.EXTRACTION.UNAVAILABLE
     (app/services/evaluator.py:110), which does not distinguish an
     unreachable endpoint from any other extraction failure. This code stays
     for the reviewer who knows which it was."
  ENGINE.OBSERVATION.AMBIGUOUS:
    "No reader returns more than one candidate for a field, so nothing can
     raise it. It describes a reading a reviewer can see in an image the
     product read once."
  ENGINE.REFERENCE_DATA.UNAVAILABLE:
    "Reference data that fails to load stops the loader at startup with a
     named violation rather than producing a finding, so no evaluation ever
     carries this."
  ENGINE.RULE.CONFLICT:
    "Nothing detects conflicting dispositions between rules. A reviewer who
     spots one has a term for it."
  ENGINE.RULESET.VERSION_NOT_FOUND:
    "One rule-set version ships, and the loader takes its version from this
     file, so there is no version to fail to find."
  WARNING.LEGIBILITY.GLARE:
    "Nothing measures glare. The gate that did counted bright pixels, which
     counts light label stock: it turned away seven faces of five sharp,
     readable labels and passed the fixture built with a hotspot over its
     warning. An unprinted white area and a blown-out one are the same pixel
     values, so what a hotspot covered is not knowable before the label is
     read, and the reader now answers WARNING.LEGIBILITY.LOW_RESOLUTION for an
     image it finds no text on at all (app/vision/local.py). The code stays
     because a reviewer looking at the label can see the glare the product
     cannot measure."
  WARNING.LEGIBILITY.NO_CONTRAST:
    "This product does not read colour, so the rule answers
     WARNING.LEGIBILITY.CONTRAST_NOT_MEASURED instead
     (rules/common/health_warning.yaml:75). The code stays because a reviewer
     looking at the label can see the contrast the product cannot measure.
     See docs/decisions.md#0013."
  WARNING.PLACEMENT.NOT_SEPARATE:
    "As above: the rule answers WARNING.PLACEMENT.ISOLATION_NOT_MEASURED
     (rules/common/health_warning.yaml:114)."
  WARNING.TYPE_SIZE.CPI_EXCEEDED:
    "As above: the rule answers WARNING.TYPE_SIZE.CPI_NOT_MEASURED
     (rules/common/health_warning.yaml:94)."
  WARNING.TYPE_SIZE.UNDER_MIN:
    "As above: the rule answers WARNING.TYPE_SIZE.HEIGHT_NOT_MEASURED
     (rules/common/health_warning.yaml:132)."
