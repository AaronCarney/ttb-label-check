rule_pack: common
rule_pack_version: "0.1.0"
rules:
  - rule_id: common.warning.present
    cfr_citation: "27 CFR §16.21"
    applies_to_classes: [wine, spirits, malt]
    reason_code: WARNING.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    parameters:
      # The only rule in any pack that may read "the reader did not find it" as
      # "the label does not carry it". Everywhere else that reading goes to a
      # reviewer, because the reader is not reliable enough at finding the
      # element for its silence to be evidence. Here it is: over the 30-label
      # corpus the reader finds the warning on 30 of 30 (`plans/wave3-R.md`,
      # `warning_present`), and §16.21 makes its absence the finding itself.
      unlocated_is_absent: true
    evidence_required: [warning_block]
    confidence_floor: 0.50
    effective_date: "1989-11-18"
    test_fixtures: [F-COMMON-WARN-PASS-01, F-COMMON-WARN-MISSING-01]

  - rule_id: common.warning.verbatim
    cfr_citation: "27 CFR §16.21"
    applies_to_classes: [wine, spirits, malt]
    reason_code: WARNING.VERBATIM.MISMATCH
    severity: reject
    match_policy: verbatim_hash
    validator: verbatim_hash
    parameters:
      asset_key: govt_warning_16_21
    asset:
      path: assets/warnings/govt_warning_16_21.txt
      sha256_pin: "b92d05da8bc5bc6f4e730685464d98d708a45594e5480fd7d7af54a9d1dfc53c"
      # §16.21 fixes the words, the numbers and the punctuation of the
      # statement. It does not fix the case of the body — §16.22(a)(2) rules
      # the heading's capitals, and common.warning.heading_caps_bold scores
      # them — and it does not fix how a printer spaced or broke the lines.
      # So case, spacing and a line-break hyphen come out of the comparison
      # and punctuation stays in.
      normalization:
        [nfkc, ascii_quotes, join_line_break_hyphens, collapse_whitespace,
         tighten_punctuation_spacing, casefold, strip_outer_ws]
    evidence_required: [warning_block]
    confidence_floor: 0.60
    effective_date: "1989-11-18"
    test_fixtures: [F-COMMON-WARN-PASS-01, F-COMMON-WARN-PARAPHRASE-01]

  - rule_id: common.warning.heading_caps_bold
    cfr_citation: "27 CFR §16.22(a)(2)"
    applies_to_classes: [wine, spirits, malt]
    reason_code: WARNING.STYLE.HEADING_NOT_BOLD_CAPS
    severity: reject
    match_policy: layout
    validator: heading_style_check
    parameters:
      target_phrase: "GOVERNMENT WARNING"
      required_case: upper
      required_weight: bold
      # The capitals are read from the heading's own text and are decided
      # here. Bold weight is a stroke-width measurement that needs the
      # heading's own region of the image; where the reader could not make
      # it, the rule reports this code and the label goes to a reviewer
      # rather than being rejected for a boldness nobody measured.
      unmeasured_weight_reason_code: WARNING.STYLE.BOLD_NOT_MEASURED
    evidence_required: [warning_block]
    confidence_floor: 0.50
    effective_date: "1989-11-18"
    test_fixtures: [F-COMMON-WARN-STYLE-PASS-01, F-COMMON-WARN-STYLE-FAIL-01]

  # ------------------------------------------------------------------
  # Below: the checks this product cannot make. Each one stays in the pack
  # with its citation and its reason, and each answers `unmeasurable` —
  # insufficient evidence, not a pass and not a rejection. The rule entry is
  # the limitation list, in the same file as the coverage; decision 0013
  # carries the argument.
  # ------------------------------------------------------------------

  - rule_id: common.warning.contrasting_bg
    cfr_citation: "27 CFR §16.22(a)(1)"
    applies_to_classes: [wine, spirits, malt]
    reason_code: WARNING.LEGIBILITY.CONTRAST_NOT_MEASURED
    severity: warn
    match_policy: layout
    validator: unmeasurable
    evidence_required: [warning_block]
    disabled: true
    notes: >-
      Not measurable here, decisions 0006 and 0013. No reader reports the
      colour of the warning text or of the surface behind it, so there is no
      contrast ratio to compare against the §16.22(a)(1) requirement. TTB's
      own Form 5100.31 instructions say TTB does not routinely review labels
      for contrasting background.
    confidence_floor: 0.40
    effective_date: "1989-11-18"
    test_fixtures: [F-COMMON-WARN-CONTRAST-PASS-01]

  - rule_id: common.warning.cpi_max
    cfr_citation: "27 CFR §16.22(a)(4)"
    applies_to_classes: [wine, spirits, malt]
    reason_code: WARNING.TYPE_SIZE.CPI_NOT_MEASURED
    severity: warn
    match_policy: lookup
    validator: unmeasurable
    decision_table_ref: cpi_16_22_a_4
    evidence_required: [warning_block]
    disabled: true
    notes: >-
      Not measurable here, decisions 0006 and 0013. Characters per inch needs
      the image's physical scale, which a photograph does not carry, so the
      reader reports no measurement. The §16.22(a)(4) table stays at
      decision_table_ref: it is the regulation's own three normative rows, and
      it is what this check reads the day a reader reports a scale.
    confidence_floor: 0.50
    effective_date: "1990-02-14"
    test_fixtures: [F-COMMON-CPI-PASS-01, F-COMMON-CPI-FAIL-1MM-01]

  - rule_id: common.warning.separate_apart
    cfr_citation: "27 CFR §16.21"
    applies_to_classes: [wine, spirits, malt]
    reason_code: WARNING.PLACEMENT.ISOLATION_NOT_MEASURED
    severity: warn
    match_policy: layout
    validator: unmeasurable
    evidence_required: [warning_block]
    disabled: true
    notes: >-
      Not measured here, decisions 0006 and 0013. Unbuilt rather than
      unbuildable: whether the statement stands separate and apart from other
      information is visible in a photograph, but no reader emits the distance
      to the nearest neighbouring text. This rule switches on the day one does.
    confidence_floor: 0.40
    effective_date: "1989-11-18"
    test_fixtures: [F-COMMON-WARN-ISOLATION-PASS-01, F-COMMON-WARN-ISOLATION-FAIL-01]

  - rule_id: common.warning.type_size_min
    cfr_citation: "27 CFR §16.22(b)"
    applies_to_classes: [wine, spirits, malt]
    reason_code: WARNING.TYPE_SIZE.HEIGHT_NOT_MEASURED
    severity: warn
    match_policy: layout
    validator: unmeasurable
    evidence_required: [warning_block]
    disabled: true
    notes: >-
      Not measurable here, decisions 0006 and 0013. §16.22(b) sets the minimum
      in millimetres and keys it to container size (1 mm at 237 mL or less,
      2 mm up to 3 L, 3 mm above), and type height needs the image's physical
      scale, which a photograph does not carry. The earlier implementation
      compared a point value against a fixed 2.0 and ignored container size
      entirely, so a pass from it did not mean what §16.22(b) says; it is
      deleted rather than left switched off.
    confidence_floor: 0.40
    effective_date: "1989-11-18"
    test_fixtures: [F-COMMON-WARN-TYPE-SIZE-PASS-01, F-COMMON-WARN-TYPE-SIZE-FAIL-01]
