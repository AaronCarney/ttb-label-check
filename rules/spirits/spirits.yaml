rule_pack: spirits
rule_pack_version: "0.1.0"
rules:
  - rule_id: spirits.brand.present
    cfr_citation: "27 CFR §5.63(a), §5.64"
    applies_to_classes: [spirits]
    reason_code: BRAND.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [brand]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-BRAND-PRESENT-01, F-SPIRITS-BRAND-MISSING-01]

  - rule_id: spirits.brand.matches_application
    cfr_citation: "27 CFR §5.64"
    applies_to_classes: [spirits]
    # The brand is the one element where the label and the application are
    # expected to carry the same words, so the comparison is on the words
    # themselves. Case, punctuation, a legal suffix and a leading "The" are
    # dropped first, which is what makes "STONE'S THROW" and "Stone's Throw"
    # the same brand. What is left is scored, and a near miss goes to a
    # reviewer rather than being called a mismatch.
    reason_code: BRAND.NAME.MISMATCH
    severity: reject
    match_policy: fuzzy
    validator: fuzzy_brand
    parameters:
      pass_threshold: 0.92
      needs_review_threshold: 0.85
      needs_review_reason_code: BRAND.NAME.NEEDS_REVIEW
    evidence_required: [brand]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-BRAND-APP-MATCH-01, F-SPIRITS-BRAND-APP-MISMATCH-01]

  - rule_id: spirits.class_type.present
    cfr_citation: "27 CFR §5.63(a)"
    applies_to_classes: [spirits]
    # §5.63(a) requires a class-and-type designation to appear on the label,
    # and that is all this rule asks. Whether the designation names a
    # recognised standard of identity is Subpart I's question, and
    # spirits.class_type.matches_soi asks it; whether it agrees with the
    # application is spirits.class_type.matches_application's. Checking
    # presence against an allow-list conflated all three and rejected
    # approved labels whose designation the list did not happen to carry —
    # "Cognac XO", "CRÈME DE CASSIS LIQUEUR". See docs/decisions/0012.
    reason_code: CLASS_TYPE.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [class_type]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-CLASS-PASS-01, F-SPIRITS-CLASS-MISSING-01]

  - rule_id: spirits.alcohol.present
    cfr_citation: "27 CFR §5.63(a), §5.65(a)"
    applies_to_classes: [spirits]
    reason_code: ALCOHOL_CONTENT.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [alc_text]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-ALC-PRESENT-01, F-SPIRITS-ALC-MISSING-01]

  - rule_id: spirits.alcohol.format
    cfr_citation: "27 CFR §5.65(b)"
    applies_to_classes: [spirits]
    reason_code: ALCOHOL_CONTENT.FORMAT.INVALID
    severity: reject
    match_policy: regex
    validator: regex_match
    parameters:
      pattern: '^\s*(?:alcohol|alc\.?)\s*[0-9]{1,2}(?:\.[0-9]+)?\s*%?\s*(?:by\s+volume|/\s*vol\.?|vol\.?)\s*$'
      ignore_case: true
    evidence_required: [alc_text]
    disabled: true
    notes: >-
      Switched off, decision 0011. The check needs the alcohol statement as
      the label prints it, and no reader returns that: the reading arrives as
      a number and a unit, and the validator rebuilt a sentence from them and
      matched the pattern against its own construction. So the rule passed
      whenever any number was read and failed when none was, which on a spirits label whose statement the reader could not place is
      a rejection of a label that complies. Switch it back on when the reader
      returns the raw alcohol text.
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-ALC-FORMAT-PASS-01, F-SPIRITS-ALC-FORMAT-FAIL-01]

  - rule_id: spirits.same_field_of_vision
    cfr_citation: "27 CFR §5.63(a)"
    applies_to_classes: [spirits]
    reason_code: LEGIBILITY.FIELD_OF_VISION.SPLIT
    severity: reject
    match_policy: layout
    validator: same_field_of_vision_check
    parameters:
      required_fields: [brand, class_type, abv, net_contents]
    evidence_required: [layout]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-SOV-PASS-01, F-SPIRITS-SOV-FAIL-01]

  - rule_id: spirits.name_address.present
    cfr_citation: "27 CFR §5.63(b)(1)"
    applies_to_classes: [spirits]
    reason_code: NAME_ADDRESS.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [bottler]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-NAME-PASS-01, F-SPIRITS-NAME-MISSING-01]

  - rule_id: spirits.net_contents.present
    cfr_citation: "27 CFR §5.63(b)(2), §5.70"
    applies_to_classes: [spirits]
    reason_code: NET_CONTENTS.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [net_contents]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-NET-PASS-01, F-SPIRITS-NET-MISSING-01]

  # ------------------------------------------------------------------
  # Label against application.
  #
  # The rules above ask whether the label carries what the regulations
  # require. These ask the separate question the product exists for:
  # whether what the label says is what the application for that label
  # declared. One rule per element, each named for the element it
  # compares, so a result can be read without knowing the rule pack.
  #
  # An element the application says nothing about produces a result of
  # "does not apply", never a failure. A difference a reviewer should
  # look at rather than a rejection carries a warn severity.
  # ------------------------------------------------------------------

  - rule_id: spirits.class_type.matches_application
    cfr_citation: "27 CFR §5.63(a), Subpart I"
    applies_to_classes: [spirits]
    reason_code: CLASS_TYPE.MATCH.APPLICATION_LABEL_DISAGREE
    severity: reject
    match_policy: lookup
    validator: designation_match
    parameters:
      # The application names a class from the registry's own list, which
      # carries filing shorthand no label shows: "VODKA 80-89 PROOF",
      # "OTHER GIN FB". The label carries a designation, which is a class
      # with the qualifiers the regulations permit around it. They agree
      # when they name the same class, not when they read the same.
      needs_review_reason_code: CLASS_TYPE.MATCH.NEEDS_REVIEW
      disagreement_reason_code: CLASS_TYPE.MATCH.APPLICATION_LABEL_DISAGREE
      recognised_classes:
        - "Bourbon Whisky"
        - "Bourbon Whiskey"
        - "Rye Whisky"
        - "Rye Whiskey"
        - "Whisky"
        - "Whiskey"
        - "Vodka"
        - "Gin"
        - "Tequila"
        - "Rum"
        - "Brandy"
        - "Cognac"
        - "Liqueur"
    evidence_required: [class_type]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-CLASS-APP-MATCH-01, F-SPIRITS-CLASS-APP-DISAGREE-01]

  - rule_id: spirits.alcohol.matches_application
    cfr_citation: "27 CFR §5.65"
    applies_to_classes: [spirits]
    # Two declared percentages, compared as numbers and required to be
    # equal. The tolerance bands elsewhere in this pack compare a label
    # against the liquid in the bottle, which is a laboratory result; this
    # compares two documents, which either agree or do not.
    reason_code: ALCOHOL_CONTENT.MATCH.APPLICATION_LABEL_DISAGREE
    severity: reject
    match_policy: exact
    validator: quantity_match
    parameters:
      amount_field: abv_labeled_pct
      needs_review_reason_code: ALCOHOL_CONTENT.MATCH.NEEDS_REVIEW
      disagreement_reason_code: ALCOHOL_CONTENT.MATCH.APPLICATION_LABEL_DISAGREE
    evidence_required: [abv]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-ALC-APP-MATCH-01, F-SPIRITS-ALC-APP-DISAGREE-01]

  - rule_id: spirits.net_contents.matches_application
    cfr_citation: "27 CFR §5.70"
    applies_to_classes: [spirits]
    reason_code: NET_CONTENTS.MATCH.APPLICATION_LABEL_DISAGREE
    severity: reject
    match_policy: exact
    validator: quantity_match
    decision_table_ref: volume_units
    parameters:
      # The label states its own unit and the application records
      # millilitres, so the label's number is converted before the two are
      # compared. Where the application's declared contents name no single
      # quantity — a keg collar listing several sizes with one struck
      # through — there is nothing to compare and a reviewer decides.
      amount_field: container_volume_ml
      needs_review_reason_code: NET_CONTENTS.MATCH.NEEDS_REVIEW
      disagreement_reason_code: NET_CONTENTS.MATCH.APPLICATION_LABEL_DISAGREE
    tolerance:
      # A converted comparison is forgiven this much of the declared figure;
      # two figures in the same unit are still compared exactly. The container
      # sizes the regulations authorize are rounded metric equivalents of
      # customary ones, so "12.7 FL. OZ." and 375 mL never convert into each
      # other exactly. 1% is above the 0.633% the worst of that rounding needs
      # across the sizes §4.72 and §5.203 authorize, and below the 1.216% that
      # separates an authorized size from the customary figure printed for its
      # nearest neighbour, so no authorized size can pass as another.
      # docs/decisions/0014 carries the working, and
      # tests/rules/_validators/test_quantity_match.py recomputes both bounds
      # from the authorized size lists so a later edit cannot quietly loosen it.
      cross_unit_relative: 0.01
    evidence_required: [net_contents]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-NET-APP-MATCH-01, F-SPIRITS-NET-APP-DISAGREE-01]

  - rule_id: spirits.name_address.matches_application
    cfr_citation: "27 CFR §5.66"
    applies_to_classes: [spirits]
    # This comparison never rejects. The application's entry is a free-text
    # block carrying the applicant's trading name, its legal name, a street
    # address and any trade name marked as used on the label; the label
    # prints one of those names with a city and a State. A name the block
    # does not carry is not evidence the label is wrong, so the outcome is
    # a reviewer's. Whether the label carries a name and address at all is
    # the presence rule above, and that one does reject.
    reason_code: NAME_ADDRESS.MATCH.NEEDS_REVIEW
    severity: warn
    match_policy: normalized
    validator: name_address_match
    parameters:
      lead_in_ends_with: by
      lead_in_window_words: 8
      anchor_words: 2
    evidence_required: [bottler]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-NAME-APP-MATCH-01, F-SPIRITS-NAME-APP-REVIEW-01]

  - rule_id: spirits.origin.matches_application
    cfr_citation: "27 CFR §5.69, 19 CFR §134.45"
    applies_to_classes: [spirits]
    # The application answers domestic or imported before it names a place.
    # Domestic means no country-of-origin statement is required, so the
    # check does not apply; the place a domestic application names is a
    # State, which is not what an origin statement carries.
    reason_code: ORIGIN.PRESENCE.MISSING
    severity: reject
    match_policy: normalized
    validator: origin_match
    parameters:
      source_field: source_of_product
      imported_value: imported
      needs_review_reason_code: ORIGIN.MATCH.NEEDS_REVIEW
      disagreement_reason_code: ORIGIN.MATCH.APPLICATION_LABEL_DISAGREE
    evidence_required: [country_origin]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-ORIGIN-APP-MATCH-01, F-SPIRITS-ORIGIN-DOMESTIC-NA-01]
