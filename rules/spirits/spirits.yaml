rule_pack: spirits
rule_pack_version: "0.1.0"
rules:
  - rule_id: spirits.brand.present
    cfr_citation: "27 CFR §5.63(a), §5.64"
    applies_to_classes: [spirits]
    reason_code: BRAND.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [brand]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-BRAND-PRESENT-01, F-SPIRITS-BRAND-MISSING-01]

  - rule_id: spirits.brand.matches_application
    cfr_citation: "27 CFR §5.64"
    applies_to_classes: [spirits]
    # The application does not declare one name. It declares a brand, often a
    # fanciful name beside it, and sometimes a trade name it told TTB is used
    # on the label, and a mark carrying any of those carries a name its own
    # application declared — so the comparison is against all of them. Case,
    # curly quotes, the trademark glyphs and accents fold away first;
    # punctuation is kept, because dropping it can change a name. A mark that
    # equals a declared name once folded, or carries one as a run of whole
    # words, is that brand. Otherwise the two spellings are scored, and a pick
    # that is not the name sends the check to search every other line read for
    # the declared brand and trade names. A name found nowhere goes to a
    # reviewer, never to a mismatch: the pick is a guess at which line is the
    # brand. docs/decisions.md#0015 and #0052 carry the reasoning.
    reason_code: BRAND.IDENTIFY.UNCERTAIN
    severity: warn
    match_policy: fuzzy
    validator: fuzzy_brand
    decision_table_ref: brand_trailing_words
    parameters:
      pass_threshold: 0.92
      needs_review_threshold: 0.85
      needs_review_reason_code: BRAND.NAME.NEEDS_REVIEW
      search_min_length: 3
      search_within_min_length: 5
      search_misread_min_length: 8
    evidence_required: [brand]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-BRAND-APP-MATCH-01, F-SPIRITS-BRAND-APP-MISMATCH-01]

  - rule_id: spirits.class_type.present
    cfr_citation: "27 CFR §5.63(a)"
    applies_to_classes: [spirits]
    # §5.63(a) requires a class-and-type designation to appear on the label,
    # and that is all this rule asks. Whether the designation names a
    # recognised standard of identity is Subpart I's question, and
    # spirits.class_type.matches_soi asks it; whether it agrees with the
    # application is spirits.class_type.matches_application's. Checking
    # presence against an allow-list conflated all three and rejected
    # approved labels whose designation the list did not happen to carry —
    # "Cognac XO", "CRÈME DE CASSIS LIQUEUR". See docs/decisions.md#0012.
    reason_code: CLASS_TYPE.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [class_type]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-CLASS-PASS-01, F-SPIRITS-CLASS-MISSING-01]

  - rule_id: spirits.alcohol.present
    cfr_citation: "27 CFR §5.63(a), §5.65(a)"
    applies_to_classes: [spirits]
    reason_code: ALCOHOL_CONTENT.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [alc_text]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-ALC-PRESENT-01, F-SPIRITS-ALC-MISSING-01]

  - rule_id: spirits.alcohol.format
    cfr_citation: "27 CFR §5.65(b)"
    applies_to_classes: [spirits]
    reason_code: ALCOHOL_CONTENT.FORMAT.NEEDS_REVIEW
    severity: warn
    match_policy: regex
    validator: regex_match
    parameters:
      # §5.65(b)(3): "alc" for alcohol, "%" for percent, "/" for "by", "vol"
      # for volume. §5.65(b)(2)(ii): any word or symbol may sit in parentheses,
      # and an abbreviation may carry a period or not.
      pattern: |-
        (?x) ^\s*
        (?:
            # (A) "Alcohol ____ percent by volume"
            \(?(?:alcohol|alc\.?)\)? \s* \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s* \(?(?:%|percent)\)?
            \s* (?:\(?by\)?|/) \s* \(?(?:volume|vol\.?)\)?
          | # (B) "____ percent alcohol by volume"
            \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s* \(?(?:%|percent)\)? \s* \(?(?:alcohol|alc\.?)\)?
            \s* (?:\(?by\)?|/) \s* \(?(?:volume|vol\.?)\)?
          | # (C) "Alcohol by volume ____ percent"
            \(?(?:alcohol|alc\.?)\)? \s* (?:\(?by\)?|/) \s* \(?(?:volume|vol\.?)\)?
            \s* \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s* \(?(?:%|percent)\)?
        )
        # §5.65(b)(1)(i): a statement of proof may accompany it.
        (?: \s* [/,(]? \s* \d+(?:\.\d+)? \s* °? \s* proof \)? )?
        \s* \.? \s* $
      ignore_case: true
    evidence_required: [alc_text]
    notes: >-
      Passes a statement in one of the three forms §5.65(b)(2)(i) lists, with
      the abbreviations and parentheses §5.65(b)(2)(ii) and (b)(3) allow, and
      a statement of proof after it. Anything else goes to a reviewer: the
      regulation also permits other representations alongside the statement,
      such as alcohol by weight, which no pattern can list
      (docs/decisions.md#0011).
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-ALC-FORMAT-PASS-01, F-SPIRITS-ALC-FORMAT-REVIEW-01]

  - rule_id: spirits.alcohol.proof_agrees
    cfr_citation: "27 CFR §5.65(b)(1)(i), §5.1"
    applies_to_classes: [spirits]
    # §5.65(b)(1)(i) lets a label state proof beside its alcohol content, and
    # §5.1 defines proof as twice the percentage of alcohol by volume. So a
    # proof the label states must be twice the ABV the same label states; the
    # application's figure does not enter into it. The whole label is searched
    # for proof figures, but only one on the ABV statement's line or the line
    # next to it can reject: a disagreeing figure anywhere else, one that
    # differs by less than its own printed precision ("86" against 42.8%), and
    # one no proof can be (above 200) go to a reviewer.
    # docs/decisions.md#0050 carries the reasoning.
    reason_code: ALCOHOL_CONTENT.PROOF.DISAGREES
    severity: reject
    match_policy: exact
    validator: proof_agreement
    parameters:
      needs_review_reason_code: ALCOHOL_CONTENT.PROOF.NEEDS_REVIEW
      disagreement_reason_code: ALCOHOL_CONTENT.PROOF.DISAGREES
    evidence_required: [abv]
    effective_date: "2022-02-09"
    test_fixtures: [F-SPIRITS-ALC-PROOF-AGREES-01, F-SPIRITS-ALC-PROOF-DISAGREES-01]

