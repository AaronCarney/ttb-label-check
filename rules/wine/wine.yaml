rule_pack: wine
rule_pack_version: "0.1.0"
rules:
  - rule_id: wine.brand.present
    cfr_citation: "27 CFR §4.32(a)(1), §4.33"
    applies_to_classes: [wine]
    reason_code: BRAND.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [brand]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-BRAND-PRESENT-01, F-WINE-BRAND-MISSING-01]

  - rule_id: wine.brand.matches_application
    cfr_citation: "27 CFR §4.33"
    applies_to_classes: [wine]
    # The application does not declare one name. It declares a brand, often a
    # fanciful name beside it, and sometimes a trade name it told TTB is used
    # on the label, and a mark carrying any of those carries a name its own
    # application declared — so the comparison is against all of them. Case,
    # curly quotes, the trademark glyphs and accents fold away first;
    # punctuation is kept, because dropping it can change a name. A mark that
    # equals a declared name once folded, or carries one as a run of whole
    # words, is that brand. Otherwise the two spellings are scored and a near
    # miss goes to a reviewer rather than being called a mismatch.
    # docs/decisions.md#0015 carries the reasoning.
    reason_code: BRAND.NAME.MISMATCH
    severity: reject
    match_policy: fuzzy
    validator: fuzzy_brand
    parameters:
      pass_threshold: 0.92
      needs_review_threshold: 0.85
      needs_review_reason_code: BRAND.NAME.NEEDS_REVIEW
    evidence_required: [brand]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-BRAND-APP-MATCH-01, F-WINE-BRAND-APP-MISMATCH-01]

  - rule_id: wine.class_type.present
    cfr_citation: "27 CFR §4.32(a)(2)"
    applies_to_classes: [wine]
    # §4.32(a)(2) requires a "class, type, or other designation" on the brand
    # label, and that is all this rule asks. It cannot ask more: §4.34(a) lets
    # a still grape wine be designated, in lieu of its class, by "any varietal
    # (grape type) designation, type designation of varietal significance,
    # semigeneric geographic type designation, or geographic distinctive
    # designation", and by a statement of composition where the class is not
    # defined at all. No allow-list holds those — the prime grape names in
    # §4.91 alone run to several hundred — so checking presence against one
    # rejected approved labels reading SANGIOVESE, CHARDONNAY, GEWURZTRAMINER,
    # PINOT NOIR, ROSE WINE and WHITE RHONE WINE. Whether the designation
    # agrees with the application is wine.class_type.matches_application's
    # question, and that rule sends what it cannot place to a reviewer instead
    # of rejecting it. See docs/decisions.md#0012.
    reason_code: CLASS_TYPE.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [class_type]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-CLASS-PASS-01, F-WINE-CLASS-MISSING-01]

  - rule_id: wine.alcohol.present_or_table
    cfr_citation: "27 CFR §4.32(b)(1), §4.36(a)"
    applies_to_classes: [wine]
    reason_code: ALCOHOL_CONTENT.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: conditional_presence
    parameters:
      required_when: abv_required
    evidence_required: [alc_text]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-ALC-PRESENT-01, F-WINE-ALC-MISSING-01]

  - rule_id: wine.alcohol.format
    cfr_citation: "27 CFR §4.36(b)"
    applies_to_classes: [wine]
    reason_code: ALCOHOL_CONTENT.FORMAT.NEEDS_REVIEW
    severity: warn
    match_policy: regex
    validator: regex_match
    parameters:
      # §4.36(b)(1) and (b)(2) give "Alcohol __ % by volume" and "Alcohol __ %
      # to __ % by volume", "or similar appropriate phrase", with "alc." (alc)
      # and "vol." (vol) as the only abbreviations. The similar phrases taken
      # here are the three word orders §5.65(b) and §7.65(b) list for the other
      # classes, "percent" for "%", "/" for "by", and parentheses.
      pattern: |-
        (?x) ^\s*
        (?:
            # "Alcohol __ % by volume", and the range "Alcohol __ % to __ % by volume"
            \(?(?:alcohol|alc\.?)\)? \s* \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s*
            (?: (?:\(?(?:%|percent)\)? \s*)? (?:to|-|–) \s* \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s* )?
            \(?(?:%|percent)\)? \s* (?:\(?by\)?|/) \s* \(?(?:volume|vol\.?)\)?
          | # "__ % alcohol by volume", and its range
            \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s*
            (?: (?:\(?(?:%|percent)\)? \s*)? (?:to|-|–) \s* \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s* )?
            \(?(?:%|percent)\)? \s* \(?(?:alcohol|alc\.?)\)?
            \s* (?:\(?by\)?|/) \s* \(?(?:volume|vol\.?)\)?
          | # "Alcohol by volume __ %", with or without a colon, and its range
            \(?(?:alcohol|alc\.?)\)? \s* (?:\(?by\)?|/) \s* \(?(?:volume|vol\.?)\)? \s* :? \s*
            \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s*
            (?: (?:\(?(?:%|percent)\)? \s*)? (?:to|-|–) \s* \(?(?:\d+(?:\.\d+)?|\.\d+)\)? \s* )?
            \(?(?:%|percent)\)?
        )
        \s* \.? \s* $
      ignore_case: true
    evidence_required: [alc_text]
    notes: >-
      Passes a single figure or a range in any of three word orders, with the
      abbreviations §4.36(b) allows. Anything else goes to a reviewer, who
      judges whether it is a "similar appropriate phrase"
      (docs/decisions.md#0011).
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-ALC-FORMAT-PASS-01, F-WINE-ALC-FORMAT-REVIEW-01]

  - rule_id: wine.name_address.present
    cfr_citation: "27 CFR §4.32(a)(3), §4.35"
    applies_to_classes: [wine]
    reason_code: NAME_ADDRESS.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [bottler]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-NAME-PASS-01, F-WINE-NAME-MISSING-01]

  - rule_id: wine.net_contents.present
    cfr_citation: "27 CFR §4.32(b)(2), §4.37"
    applies_to_classes: [wine]
    reason_code: NET_CONTENTS.PRESENCE.MISSING
    severity: reject
    match_policy: exact
    validator: presence_check
    evidence_required: [net_contents]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-NET-PASS-01, F-WINE-NET-MISSING-01]

  # ------------------------------------------------------------------
  # Label against application.
  #
  # The rules above ask whether the label carries what the regulations
  # require. These ask the separate question the product exists for:
  # whether what the label says is what the application for that label
  # declared. One rule per element, each named for the element it
  # compares, so a result can be read without knowing the rule pack.
  #
  # An element the application says nothing about produces a result of
  # "does not apply", never a failure. A difference a reviewer should
  # look at rather than a rejection carries a warn severity.
  # ------------------------------------------------------------------

  - rule_id: wine.class_type.matches_application
    cfr_citation: "27 CFR §4.32(a)(2), §4.34"
    applies_to_classes: [wine]
    reason_code: CLASS_TYPE.MATCH.APPLICATION_LABEL_DISAGREE
    severity: reject
    match_policy: lookup
    validator: designation_match
    decision_table_ref: wine_designations
    parameters:
      # "Wine" is on the list on purpose, and it is what makes a label
      # reading "WHITE RHONE WINE" agree with an application reading
      # "TABLE WHITE WINE": both name a wine, and nothing narrower lines
      # them up. The cost is that a wine label naming no class narrower
      # than "wine" is only checked to that level. A label carrying a
      # grape variety instead — "SANGIOVESE", "CHARDONNAY" — names no
      # class at all and goes to a reviewer, which is the outcome the
      # approved labels in the fixture set record as correct.
      #
      # "Champagne" is here because §4.21(b)(2) makes it a type of sparkling
      # light wine and §4.34(a) lets the type designation "champagne" appear
      # "in lieu of the class designation 'sparkling wine'", so the two name
      # the same wine and the decision table above says so. Listing it
      # without that table would turn the substitution the regulation permits
      # into a reported disagreement.
      #
      # A colour is not a class, so "Rose Wine" is not here: §4.21(a)(4) puts
      # "pink (or rose) wine" beside "red wine", "amber wine" and "white
      # wine" as ways of designating the colour of a Class 1 grape wine, not
      # as a class of its own. Nothing is lost by dropping it — every
      # designation carrying "rose wine" carries "wine", which is listed, so
      # both sides already name that class and agree there.
      needs_review_reason_code: CLASS_TYPE.MATCH.NEEDS_REVIEW
      disagreement_reason_code: CLASS_TYPE.MATCH.APPLICATION_LABEL_DISAGREE
      recognised_classes:
        - "Wine"
        - "Table Wine"
        - "Light Wine"
        - "Dessert Wine"
        - "Sparkling Wine"
        - "Champagne"
        - "Sherry"
    evidence_required: [class_type]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-CLASS-APP-MATCH-01, F-WINE-CLASS-APP-DISAGREE-01]

  - rule_id: wine.alcohol.matches_application
    cfr_citation: "27 CFR §4.36"
    applies_to_classes: [wine]
    # Two declared percentages, compared as numbers and required to be
    # equal. The tolerance bands elsewhere in this pack compare a label
    # against the liquid in the bottle, which is a laboratory result; this
    # compares two documents, which either agree or do not.
    reason_code: ALCOHOL_CONTENT.MATCH.APPLICATION_LABEL_DISAGREE
    severity: reject
    match_policy: exact
    validator: quantity_match
    parameters:
      amount_field: abv_labeled_pct
      needs_review_reason_code: ALCOHOL_CONTENT.MATCH.NEEDS_REVIEW
      disagreement_reason_code: ALCOHOL_CONTENT.MATCH.APPLICATION_LABEL_DISAGREE
    evidence_required: [abv]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-ALC-APP-MATCH-01, F-WINE-ALC-APP-DISAGREE-01]

  - rule_id: wine.net_contents.matches_application
    cfr_citation: "27 CFR §4.37"
    applies_to_classes: [wine]
    reason_code: NET_CONTENTS.MATCH.APPLICATION_LABEL_DISAGREE
    severity: reject
    match_policy: exact
    validator: quantity_match
    decision_table_ref: volume_units
    parameters:
      # The label states its own unit and the application records
      # millilitres, so the label's number is converted before the two are
      # compared. Where the application's declared contents name no single
      # quantity — a keg collar listing several sizes with one struck
      # through — there is nothing to compare and a reviewer decides.
      amount_field: container_volume_ml
      needs_review_reason_code: NET_CONTENTS.MATCH.NEEDS_REVIEW
      disagreement_reason_code: NET_CONTENTS.MATCH.APPLICATION_LABEL_DISAGREE
    tolerance:
      # A converted comparison is forgiven this much of the declared figure;
      # two figures in the same unit are still compared exactly. A label
      # states a customary size to a tenth of a fluid ounce while the
      # application records the authorized metric one, so the two never
      # convert into each other exactly: 375 mL is 12.68 fluid ounces, and the
      # label prints "12.7 FL. OZ.". 1% is above the 0.633% that rounding needs
      # across the sizes §4.72 and §5.203 authorize, and below the 1.216% that
      # separates an authorized size from the customary figure printed for its
      # nearest neighbour, so no authorized size can pass as another.
      # docs/decisions.md#0014 carries the working, and
      # tests/rules/_validators/test_quantity_match.py recomputes both bounds
      # from the authorized size lists so a later edit cannot quietly loosen it.
      cross_unit_relative: 0.01
    evidence_required: [net_contents]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-NET-APP-MATCH-01, F-WINE-NET-APP-DISAGREE-01]

  - rule_id: wine.name_address.matches_application
    cfr_citation: "27 CFR §4.35"
    applies_to_classes: [wine]
    # This comparison never rejects. The application's entry is a free-text
    # block carrying the applicant's trading name, its legal name, a street
    # address and any trade name marked as used on the label; the label
    # prints one of those names with a city and a State. A name the block
    # does not carry is not evidence the label is wrong, so the outcome is
    # a reviewer's. Whether the label carries a name and address at all is
    # the presence rule above, and that one does reject.
    reason_code: NAME_ADDRESS.MATCH.NEEDS_REVIEW
    severity: warn
    match_policy: normalized
    validator: name_address_match
    parameters:
      lead_in_ends_with: by
      lead_in_window_words: 8
      anchor_words: 2
    evidence_required: [bottler]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-NAME-APP-MATCH-01, F-WINE-NAME-APP-REVIEW-01]

  - rule_id: wine.origin.matches_application
    cfr_citation: "27 CFR §4.35(e), 19 CFR §134.45"
    applies_to_classes: [wine]
    # The application answers domestic or imported before it names a place.
    # Domestic means no country-of-origin statement is required, so the
    # check does not apply; the place a domestic application names is a
    # State, which is not what an origin statement carries.
    reason_code: ORIGIN.PRESENCE.MISSING
    severity: reject
    match_policy: normalized
    validator: origin_match
    parameters:
      source_field: source_of_product
      imported_value: imported
      needs_review_reason_code: ORIGIN.MATCH.NEEDS_REVIEW
      disagreement_reason_code: ORIGIN.MATCH.APPLICATION_LABEL_DISAGREE
    evidence_required: [country_origin]
    effective_date: "1936-12-15"
    test_fixtures: [F-WINE-ORIGIN-APP-MATCH-01, F-WINE-ORIGIN-DOMESTIC-NA-01]
